name: CI/CD

on: [push]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Lint
      run: npm run lint

    - name: Build XPI
      run: npm run build

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: Toggle-Native-Tab-Bar-Build
        path: web-ext-artifacts/*.zip
